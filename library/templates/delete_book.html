<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Book</title>
</head>
<body>
    <h1>Delete Book</h1>

    <p>Are you sure to delete "<strong>{{book.title}}</strong>"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="Submit">Yes,Delete</button>
    </form>
<br>
    <a href="{% url 'book_list' %}">Cancel</a>
</body>
</html>
