{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Chai</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>chai detail page </h1>
    
{% block content %}

    <h1>{{ chai.name }}</h1>
    <img src="{{ chai.image.url }}" alt="{{ chai.name }}">
    <h2>Price: ₹{{ chai.price }}</h2>
    <p> Description :{{ chai.description }}</p>
      <a href="{% url 'all_chai' %}">
        <button class="bck">Back to All Chai</button>
    </a>


{% endblock %}
        
</body>
</html>
